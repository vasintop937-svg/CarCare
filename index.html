<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>CarDiary</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0D0F14;--s:#161920;--s2:#1E2230;--b:rgba(255,255,255,.07);--a:#C8FF00;--t:#F0F2F8;--m:#7A8099;--fd:'Syne',sans-serif;--fb:'DM Sans',sans-serif}
body{background:var(--bg);color:var(--t);font-family:var(--fb);min-height:100vh}
#app{max-width:480px;margin:0 auto;min-height:100vh}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 12px;position:sticky;top:0;z-index:50;background:linear-gradient(to bottom,var(--bg) 80%,transparent)}
.logo{font-family:var(--fd);font-size:22px;font-weight:800;letter-spacing:-.5px}
.logo span{color:var(--a)}
.ibtn{min-width:42px;height:42px;border-radius:12px;background:var(--s);border:1px solid var(--b);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t);font-size:16px;padding:0 10px}
.card{background:var(--s);border:1px solid var(--b);border-radius:16px;padding:20px;transition:all .2s}
.cardh{cursor:pointer}
.cardh:hover{border-color:rgba(200,255,0,.2);transform:translateY(-1px)}
.wrap{padding:0 16px 140px}
.sec{font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--m);text-transform:uppercase;margin:20px 0 10px}
.fabrow{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:40}
.fab{background:var(--a);color:#0D0F14;border:none;border-radius:14px;padding:13px 18px;font-family:var(--fd);font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;cursor:pointer;box-shadow:0 8px 28px rgba(200,255,0,.25);white-space:nowrap}
.fabg{background:var(--s2);color:var(--t);border:1px solid var(--b);box-shadow:none}
.fabp{color:#F59E0B;border:1px solid rgba(245,158,11,.3);background:var(--s2);box-shadow:none}
.empty{text-align:center;padding:60px 32px}
.empty h3{font-family:var(--fd);font-size:20px;font-weight:700;margin-bottom:8px}
.empty p{color:var(--m);font-size:14px;line-height:1.5}
.hero{background:linear-gradient(135deg,var(--s),var(--s2));border:1px solid var(--b);border-radius:20px;padding:24px;margin-bottom:16px}
.htop{display:flex;gap:16px;align-items:flex-start;margin-bottom:18px}
.hava{width:64px;height:64px;border-radius:18px;background:#3B82F633;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.htitle{font-family:var(--fd);font-size:22px;font-weight:800;line-height:1.2}
.hsub{color:var(--m);font-size:14px;margin-top:4px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.stat{background:rgba(255,255,255,.04);border-radius:12px;padding:12px;border:1px solid var(--b)}
.statv{font-family:var(--fd);font-size:16px;font-weight:700}
.statk{font-size:11px;color:var(--m);margin-top:2px}
.ri{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--b);cursor:pointer}
.ri:last-child{border-bottom:none}
.ri:hover{opacity:.8}
.rdot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px}
.rb{flex:1;min-width:0}
.rt{font-weight:500;font-size:15px}
.rm{font-size:12px;color:var(--m);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.rc{font-family:var(--fd);font-weight:700;font-size:15px;color:var(--a);flex-shrink:0}
.pill{display:inline-flex;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:500}
.rcard{padding:4px 20px 20px}
.total{display:flex;justify-content:space-between;align-items:center;padding:12px 0 0;border-top:1px solid var(--b);margin-top:6px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:flex-end;z-index:100}
.modal{width:100%;max-width:480px;margin:0 auto;background:var(--s);border-radius:24px 24px 0 0;padding:24px 20px 44px;max-height:90vh;overflow-y:auto}
.mhdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.mtitle{font-family:var(--fd);font-size:20px;font-weight:700}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;color:var(--m);font-weight:500;margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
.inp{width:100%;background:var(--s2);border:1px solid var(--b);border-radius:12px;padding:11px 14px;color:var(--t);font-family:var(--fb);font-size:15px;outline:none}
.inp:focus{border-color:rgba(200,255,0,.4)}
textarea.inp{resize:vertical;min-height:70px}
select.inp option{background:var(--s2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btnok{width:100%;padding:14px;border:none;border-radius:14px;background:var(--a);color:#0D0F14;font-family:var(--fd);font-size:16px;font-weight:700;cursor:pointer;margin-top:6px}
.btndel{background:rgba(239,68,68,.1);color:#EF4444;border:1px solid rgba(239,68,68,.2);border-radius:12px;padding:12px;font-size:14px;cursor:pointer;width:100%;font-family:var(--fb);display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cat{padding:11px;border-radius:12px;border:1px solid var(--b);cursor:pointer;display:flex;align-items:center;gap:10px;font-size:13px}
.caton{border-color:var(--a);background:rgba(200,255,0,.07)}
.cdot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.emojis{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.emj{width:44px;height:44px;border-radius:12px;background:var(--s2);border:1px solid var(--b);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.emjon{border-color:var(--a);background:rgba(200,255,0,.1)}
.qbox{background:var(--s2);border:1px solid rgba(200,255,0,.2);border-radius:14px;padding:16px;margin-top:14px}
.qlbl{font-size:11px;color:var(--a);font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.qtxt{font-family:var(--fd);font-size:16px;font-weight:600;line-height:1.4;margin-bottom:12px}
.qlinks{display:flex;gap:8px;flex-wrap:wrap}
.qlink{background:var(--s);border:1px solid var(--b);border-radius:10px;padding:7px 12px;font-size:13px;text-decoration:none;color:var(--t);display:inline-flex;align-items:center}
.copybtn{background:rgba(200,255,0,.1);border:1px solid rgba(200,255,0,.2);color:var(--a);border-radius:10px;padding:7px 12px;font-size:13px;cursor:pointer}
.remi{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--b)}
.remi:last-child{border-bottom:none}
.remico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.remb{flex:1;min-width:0}
.remttl{font-size:14px;font-weight:500}
.remmeta{font-size:12px;color:var(--m);margin-top:2px}
.pbar{height:4px;border-radius:2px;background:var(--s2);margin-top:6px;overflow:hidden}
.pfill{height:100%;border-radius:2px}
.rbadge{border-radius:8px;padding:4px 8px;font-size:11px;font-weight:600;white-space:nowrap;flex-shrink:0}
.tmpls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.tmpl{padding:12px;border-radius:12px;border:1px solid var(--b);cursor:pointer;display:flex;align-items:center;gap:10px;font-size:13px}
.tmpl:hover{border-color:rgba(200,255,0,.3)}
.pbtn{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--b);background:var(--s2);color:var(--m)}
.pbtnon{border-color:var(--a);background:rgba(200,255,0,.1);color:var(--a)}
.alert{border-radius:14px;padding:13px 16px;display:flex;align-items:center;gap:12px;margin-bottom:8px;cursor:pointer;border:1px solid}
.alcr{background:rgba(239,68,68,.07);border-color:rgba(239,68,68,.2)}
.alwn{background:rgba(245,158,11,.07);border-color:rgba(245,158,11,.2)}
.wcrd{border-radius:18px;padding:18px;border:1px solid var(--b);background:var(--s);margin-bottom:4px}
.wtemp{font-family:var(--fd);font-size:38px;font-weight:800;line-height:1}
.frow{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px}
.fday{flex-shrink:0;background:rgba(255,255,255,.04);border-radius:10px;padding:8px 10px;text-align:center;min-width:52px}
.fdnm{font-size:10px;color:var(--m);margin-bottom:3px}
.fdmx{font-family:var(--fd);font-size:14px;font-weight:700}
.fdmn{font-size:10px;color:var(--m)}
.tadvice{border-radius:12px;padding:12px 14px;font-size:13px;font-weight:500;display:flex;align-items:flex-start;gap:10px;line-height:1.5;margin-top:4px}
.tok{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.2);color:#10B981}
.twarn{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.25);color:#F59E0B}
.tcrit{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#EF4444}
.plan{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--b)}
.plan:last-child{border-bottom:none}
.planbar{width:6px;border-radius:3px;flex-shrink:0;align-self:stretch;min-height:44px}
.planb{flex:1;min-width:0}
.planttl{font-weight:500;font-size:15px;margin-bottom:3px}
.planmeta{font-size:12px;color:var(--m);display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.planacts{display:flex;gap:8px;flex-wrap:wrap}
.donebtn{padding:6px 14px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:rgba(200,255,0,.12);color:var(--a)}
.sbtn{padding:6px 12px;border-radius:10px;font-size:12px;cursor:pointer;border:1px solid var(--b);background:var(--s2);color:var(--m);text-decoration:none;display:inline-flex;align-items:center}
.prisel{display:flex;gap:8px;margin-bottom:4px}
.pribtn{flex:1;padding:10px 6px;border-radius:12px;border:1px solid var(--b);cursor:pointer;text-align:center;font-size:12px;font-weight:600;background:var(--s2);color:var(--m)}
.prih{border-color:#EF4444;background:rgba(239,68,68,.1);color:#EF4444}
.prim{border-color:#F59E0B;background:rgba(245,158,11,.1);color:#F59E0B}
.pril{border-color:#10B981;background:rgba(16,185,129,.1);color:#10B981}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--s2);border:1px solid var(--b);border-radius:12px;padding:11px 18px;font-size:14px;z-index:200;box-shadow:0 8px 28px rgba(0,0,0,.4);white-space:nowrap;display:none}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--b);border-radius:4px}

/* Auth */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.auth-card{background:var(–s);border:1px solid var(–b);border-radius:24px;padding:32px 24px;width:100%;max-width:400px}
.auth-logo{font-family:var(–fd);font-size:28px;font-weight:800;text-align:center;margin-bottom:8px}
.auth-logo span{color:var(–a)}
.auth-sub{text-align:center;color:var(–m);font-size:14px;margin-bottom:28px;line-height:1.5}
.auth-tabs{display:flex;background:var(–s2);border-radius:12px;padding:4px;margin-bottom:24px;gap:4px}
.auth-tab{flex:1;padding:10px;border:none;border-radius:9px;font-family:var(–fd);font-size:14px;font-weight:600;cursor:pointer;background:transparent;color:var(–m);transition:all .2s}
.auth-tab.on{background:var(–s);color:var(–t);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.auth-err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:#EF4444;border-radius:12px;padding:11px 14px;font-size:13px;margin-bottom:14px;display:none}
.auth-forgot{text-align:right;margin-top:-8px;margin-bottom:14px}
.auth-forgot button{background:none;border:none;color:var(–m);font-size:12px;cursor:pointer;font-family:var(–fb)}
.auth-forgot button:hover{color:var(–a)}
.user-bar{display:flex;align-items:center;gap:8px}
.user-email{font-size:11px;color:var(–m);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.signout-btn{padding:6px 12px;border-radius:10px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(–b);background:var(–s2);color:var(–m)}
</style>

  if (!doc) return;
  showSync();
  doc.set({data: JSON.stringify(d), updated: Date.now()})
    .then(function(){ hideSync(); })

}

function loadFromCloud(callback) {
  var doc = getUserDoc();
  if (!doc) { callback({cars:[],records:[],reminders:[],planned:[],stations:[]}); return; }
  showSync();
  doc.get().then(function(snap) {
    hideSync();
    if (snap.exists) {
      try {
        var cloudData = JSON.parse(snap.data().data);
        callback(cloudData);
      } catch(e) { callback({cars:[],records:[],reminders:[],planned:[],stations:[]}); }
    } else {
      // New user - start fresh, ignore localStorage
      callback({cars:[],records:[],reminders:[],planned:[],stations:[]});
    }
  }).catch(function(){ hideSync(); callback({cars:[],records:[],reminders:[],planned:[],stations:[]}); });
}

function remPct(rem) {
  var now=new Date(), pct=0;
  if ((rem.intervalType==='date'||rem.intervalType==='both') && rem.lastDate && rem.intervalMonths) {
    var l=new Date(rem.lastDate), n=new Date(l); n.setMonth(n.getMonth()+parseInt(rem.intervalMonths));
    pct = Math.max(pct, Math.min(Math.round(((now-l)/(n-l))*100), 110));
  }
  if ((rem.intervalType==='km'||rem.intervalType==='both') && rem.lastKm && rem.intervalKm && rem.currentKm)
    pct = Math.max(pct, Math.min(Math.round(((rem.currentKm-rem.lastKm)/rem.intervalKm)*100), 110));
  return pct;
}

  var n=new Date(rem.lastDate); n.setMonth(n.getMonth()+parseInt(rem.intervalMonths));

function tireStatus(lt, forecast) {
  if (!lt||!lt.tireType) return null;
  var t = lt.tireType;
  if (t==='all-season') return {level:'ok', msg:T['tire-allseason-ok']};
  var now=new Date(), m=now.getMonth()+1, d=now.getDate();
  var deepW = (m===12&&d>5)||m===1||m===2||m===3;
  var deepS = (m===6&&d>5)||m===7||m===8;
  if (deepW&&t==='summer') return {level:'danger', msg:T['tire-danger-summer']};
  if (deepS&&t==='winter') return {level:'danger', msg:T['tire-danger-winter']};
  var inA = m===9||m===10||m===11||(m===12&&d<=5);
  var inSp = m===4||m===5||(m===6&&d<=5);
  if (forecast&&forecast.list) {
    var days=forecast.list.filter(function(_,i){return i%8===0;}).slice(0,7);
    var mins=days.map(function(x){return x.main.temp_min;});
    var maxs=days.map(function(x){return x.main.temp_max;});
    var snow=days.some(function(x){return x.weather[0].main==='Snow';});
    var frost=mins.some(function(x){return x<=0;});
    var coldN=mins.filter(function(x){return x<7;}).length;
    var warmD=maxs.filter(function(x){return x>10;}).length;
    var avgMin=mins.reduce(function(a,b){return a+b;},0)/mins.length;
    var avgMax=maxs.reduce(function(a,b){return a+b;},0)/maxs.length;
    if (inA&&t==='summer') {
      if (snow||frost) return {level:'critical', msg:T['tire-frost']};
      if (coldN>=4) return {level:'warn', msg:coldN+' '+T['tire-cold']};
      return {level:'ok', msg:T['tire-ok-summer']};
    }
    if (inSp&&t==='winter') {
      if (avgMax>15&&avgMin>7) return {level:'critical', msg:T['tire-hot']};
      if (warmD>=5&&avgMin>3) return {level:'warn', msg:warmD+' '+T['tire-warm']};
      return {level:'ok', msg:T['tire-ok-winter']};
    }
  }
  if (inA&&t==='summer') return {level:'warn', msg:T['tire-warn-autumn']};
  if (inSp&&t==='winter') return {level:'warn', msg:T['tire-warn-spring']};
  var tLabel = t==='summer'?T['tire-summer']:t==='winter'?T['tire-winter']:T['tire-all'];
  return {level:'ok', msg:tLabel+' - '+T['tire-season-ok']};
}

function mk(tag, attrs, children) {

    Object.keys(attrs).forEach(function(k) {
      if (k==='cls') e.className = attrs[k];
      else if (k==='css') e.style.cssText = attrs[k];
      else if (k==='txt') e.textContent = attrs[k];
      else if (k==='html') e.innerHTML = attrs[k];
      else e.setAttribute(k, attrs[k]);
    });
  }
  if (children) {
    [].concat(children).forEach(function(c) {
      if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
  }
  return e;
}

function buildCar() {

  // hero
  var hero = mk('div',{cls:'hero'});

    var pc = mk('div',{cls:'card rcard'});
    plans.forEach(function(p){pc.appendChild(buildPlanItem(p,car));});
    wrap.appendChild(pc);
  }

  // records - current calendar month only
  var now2 = new Date();

    var d = new Date(r.date);
    return d.getFullYear()===now2.getFullYear() && d.getMonth()===now2.getMonth();
  });
  var monthName = now2.toLocaleDateString('ru',{month:'long',year:'numeric'});

  var secRow = mk('div',{css:'display:flex;align-items:center;justify-content:space-between;margin-top:24px;margin-bottom:10px'});
  secRow.appendChild(mk('div',{cls:'sec', css:'margin:0', txt:monthName}));
  if (recs.length > 0) {
    var histBtn = on(mk('button',{cls:'pbtn', css:'font-size:11px', txt:'\u0412\u0441\u044f \u0438\u0441\u0442\u043e\u0440\u0438\u044f \u2192'}), 'click', function(){ view='history'; render(); });
    secRow.appendChild(histBtn);
  }
  wrap.appendChild(secRow);

  if (recentRecs.length === 0) {
    var empty = mk('div',{cls:'card', css:'text-align:center;padding:32px'});
    empty.appendChild(mk('div',{css:'font-size:32px;margin-bottom:8px', txt:'\ud83d\udccb'}));
    empty.appendChild(mk('div',{css:'color:var(--m);font-size:14px', txt:recs.length>0?'\u0412 \u044d\u0442\u043e\u043c \u043c\u0435\u0441\u044f\u0446\u0435 \u0437\u0430\u043f\u0438\u0441\u0435\u0439 \u043d\u0435\u0442':T['no-records-title']+'. '+T['no-records-desc']+'.' }));
    wrap.appendChild(empty);
  } else {

    total.appendChild(mk('div',{css:'font-family:var(--fd);font-size:20px;font-weight:800;color:var(--a)', txt:cSpent(car.id).toLocaleString('ru')+' \u20BD'}));
    rcard.appendChild(total); wrap.appendChild(rcard);

  var delBtn = on(mk('button',{cls:'btndel', css:'margin-top:32px', txt:'\ud83d\uddd1 '+T['del-car']}), 'click', function(){
    if (!confirm(T['del-confirm-car'])) return;

    D.records=D.records.filter(function(r){return r.carId!==car.id;});
    D.reminders=(D.reminders||[]).filter(function(r){return r.carId!==car.id;});
    D.planned=(D.planned||[]).filter(function(p){return p.carId!==car.id;});
    save(D); view='home'; render();
  });
  wrap.appendChild(delBtn); div.appendChild(wrap);

  var fabrow = mk('div',{cls:'fabrow'});
  fabrow.appendChild(on(mk('button',{cls:'fab fabg', txt:'\ud83d\udd14 '+T['remind']}), 'click', function(){openModal('rem');}));
  fabrow.appendChild(on(mk('button',{cls:'fab fabp', txt:'\ud83d\udccb '+T['to-plan']}), 'click', function(){openModal('plan');}));
  fabrow.appendChild(on(mk('button',{cls:'fab', txt:'+ '+T['nav-record']}), 'click', function(){openModal('rec');}));
  div.appendChild(fabrow);
  return div;
}

function buildHistory() {
  var car = D.cars.filter(function(c){return c.id===selCarId;})[0];

// MODALS
var currentModal = null;
function openModal(type) {
  closeModal();
  var ov = on(mk('div',{cls:'overlay'}),'click',function(e){if(e.target===ov)closeModal();});
  var modal = mk('div',{cls:'modal'});
  if (type==='car') buildCarForm(modal);
  else if (type==='rec') buildRecForm(modal);
  else if (type==='rem') buildRemForm(modal,1,null);
  else if (type==='plan') buildPlanForm(modal);
  ov.appendChild(modal); document.body.appendChild(ov); currentModal=ov;
}
function closeModal() { if (currentModal) { currentModal.remove(); currentModal=null; } }

function mHdr(modal, title, showBack, backFn) {
  var h=mk('div',{cls:'mhdr'});
  var left=mk('div',{css:'display:flex;align-items:center;gap:10px'});
  if (showBack) left.appendChild(on(mk('button',{cls:'ibtn',css:'width:32px;height:32px;border-radius:8px',txt:'\u25c4'}),'click',backFn));
  left.appendChild(mk('div',{cls:'mtitle',txt:title}));
  h.appendChild(left);
  h.appendChild(on(mk('button',{cls:'ibtn',txt:'\u2715'}),'click',closeModal));
  modal.appendChild(h);
}
function addField(modal, label, input) {
  var f=mk('div',{cls:'field'}); f.appendChild(mk('label',{txt:label})); f.appendChild(input); modal.appendChild(f); return input;
}
function mkInp(type, ph, val) {
  var i = mk(type==='textarea'?'textarea':(type==='select'?'select':'input'),{cls:'inp'});
  if (type!=='textarea'&&type!=='select') i.type=type||'text';
  if (ph) i.placeholder=ph;
  if (val!==undefined&&val!==null) i.value=val;
  return i;
}

        } else if (changed==='liters' && !isNaN(l) && !isNaN(t) && t>0) {
          priceInp.value = (t/l).toFixed(2);
        } else if (changed==='total' && !isNaN(t) && !isNaN(p) && p>0) {
          litersInp.value = (t/p).toFixed(2);
        } else if (changed==='total' && !isNaN(t) && !isNaN(l) && l>0) {
          priceInp.value = (t/l).toFixed(2);

  function saveRecord(cat) {
    var rec = {id:uid(), carId:selCarId, category:cat, createdAt:new Date().toISOString()};
    rec.date = (formData.date&&formData.date.value) ? formData.date.value : new Date().toISOString().slice(0,10);
    rec.mileage = formData.mili ? formData.mili.value : '';

    if (cat==='maintenance') {
      var parts=[], totalCost=0;
      (formData.chks||[]).forEach(function(r){
        if(r.chk.checked){ parts.push(r.key); totalCost+=parseFloat(r.cost.value)||0; }
      });
      if (parts.length===0) { showToast('\u0412\u044b\u0431\u0435\u0440\u0438 \u0445\u043e\u0442\u044f \u0431\u044b \u043e\u0434\u0438\u043d \u044d\u043b\u0435\u043c\u0435\u043d\u0442'); return; }
      rec.title = parts.join(', ');
      rec.cost = totalCost||'';
      rec.notes = formData.notes ? formData.notes.value : '';
      rec.maintenanceItems = parts;

    } else if (cat==='fuel') {
      var fuelLabel = formData.selFuelType==='benzin'?('\u0411\u0435\u043d\u0437\u0438\u043d '+(formData.octane||'95')):formData.selFuelType==='dizel'?'\u0414\u0438\u0437\u0435\u043d\u044c':'\u041c\u0435\u0442\u0430\u043d';
      var station = formData.stInp ? formData.stInp.value.trim() : '';
      // Save station to memory
      if (station && formData.savedStations && formData.savedStations.indexOf(station)===-1) {
        formData.savedStations.push(station);
        D.stations = formData.savedStations;
      }
      rec.title = fuelLabel + (station?' \u2014 '+station:'');
      rec.fuelType = formData.selFuelType;
      rec.octane = formData.octane||'';
      rec.station = station;
      rec.pricePerLiter = formData.priceInp ? formData.priceInp.value : '';
      rec.liters = formData.litersInp ? formData.litersInp.value : '';
      rec.cost = formData.totalInp && formData.totalInp.value ? formData.totalInp.value : (rec.pricePerLiter&&rec.liters?(parseFloat(rec.pricePerLiter)*parseFloat(rec.liters)).toFixed(0):'');

    } else if (cat==='insurance') {
      if (!formData.docName.value.trim()) { showToast(T['need-name']); return; }
      rec.title = formData.docName.value.trim();
      rec.isPermanent = formData.permChk.checked;
      rec.expiry = formData.permChk.checked ? '' : formData.expiryInp.value;
      rec.cost = formData.costInp.value;
      // Add reminder if has expiry
      if (!formData.permChk.checked && formData.expiryInp.value) {
        if (!D.reminders) D.reminders=[];
        D.reminders.push({id:uid(),carId:selCarId,title:rec.title,icon:'\ud83d\udcdc',intervalType:'date',lastDate:rec.date,intervalMonths:Math.max(1,Math.round((new Date(formData.expiryInp.value)-new Date(rec.date))/2592000000)-1),expiryDate:formData.expiryInp.value,createdAt:new Date().toISOString()});
      }

    } else if (cat==='tires') {
      var selWheels = (formData.wheelChks||[]).filter(function(w){return w.chk.checked;}).map(function(w){return w.key;});
      var whatLabel = formData.selWhat==='tire'?'\u0448\u0438\u043d\u0430':'\u0434\u0438\u0441\u043a';
      var opLabel = formData.selOp==='change'?'\u0417\u0430\u043c\u0435\u043d\u0430':'\u0420\u0435\u043c\u043e\u043d\u0442';
      var wheelMap = {fr:'\u041f\u041f',fl:'\u041f\u041b',rr:'\u0417\u041f',rl:'\u0417\u041b'};
      rec.title = opLabel+' '+whatLabel+(selWheels.length>0?' ('+selWheels.map(function(w){return wheelMap[w];}).join(', ')+')':'');
      rec.tireOp = formData.selOp;
      rec.tireWhat = formData.selWhat;
      rec.wheels = selWheels;
      rec.cost = formData.costInp.value;

    } else if (cat==='repair') {
      if (!formData.title||!formData.title.value.trim()) { showToast(T['need-name']); return; }
      rec.title = formData.title.value.trim();
      rec.part = formData.part ? formData.part.value.trim() : '';
      rec.cost = formData.costInp ? formData.costInp.value : '';
      rec.notes = formData.notes ? formData.notes.value : '';

    } else { // other
      if (!formData.svc||!formData.svc.value.trim()) { showToast(T['need-name']); return; }
      rec.title = formData.svc.value.trim();
      rec.part = formData.part ? formData.part.value.trim() : '';
      rec.cost = formData.costInp ? formData.costInp.value : '';
    }

    D.records.push(rec);
    save(D); closeModal(); showToast(T['added-rec']); render();
  }
}


function buildRemForm(modal, step, tmpl) {
  modal.innerHTML='';
  if (step===1) {
    mHdr(modal,T['rem-title'],false,null);
    modal.appendChild(mk('div',{css:'font-size:13px;color:var(--m);margin-bottom:14px',txt:T['rem-what']}));
    var tg=mk('div',{cls:'tmpls'});
    REM_LABELS.forEach(function(lbl,idx){
      var b=mk('div',{cls:'tmpl'}); b.appendChild(mk('span',{css:'font-size:20px',txt:REM_ICONS[idx]})); b.appendChild(document.createTextNode(lbl));
      on(b,'click',function(){buildRemForm(modal,2,{icon:REM_ICONS[idx],label:lbl,km:REM_KM[idx],mo:REM_MO[idx]});});
      tg.appendChild(b);
    });
    modal.appendChild(tg); return;
  }
  var car=D.cars.filter(function(c){return c.id===selCarId;})[0];
  mHdr(modal,T['rem-setup'],true,function(){buildRemForm(modal,1,null);});
  var title=mkInp('text','',tmpl?tmpl.label:''); addField(modal,T['rem-name'],title);
  var iDiv=mk('div',{cls:'field'}); iDiv.appendChild(mk('label',{txt:T['rem-interval']}));
  var irow=mk('div',{css:'display:flex;gap:8px;margin-bottom:12px'});
  var selItype='both'; var ibtns=[];
  [['km',T['rem-bykm']],['date',T['rem-bydate']],['both',T['rem-both']]].forEach(function(it){
    var b=mk('button',{cls:'pbtn '+(it[0]==='both'?'pbtnon':''),txt:it[1]});
    on(b,'click',function(){ ibtns.forEach(function(x){x.className='pbtn';}); b.className='pbtn pbtnon'; selItype=it[0]; kmRow.style.display=(it[0]==='km'||it[0]==='both')?'block':'none'; moRow.style.display=(it[0]==='date'||it[0]==='both')?'block':'none'; });
    ibtns.push(b); irow.appendChild(b);
  });
  iDiv.appendChild(irow);
  var kmInp=mkInp('number',T['rem-kmhint'],tmpl&&tmpl.km?tmpl.km:''); kmInp.style.marginBottom='8px';
  var kmRow=mk('div'); kmRow.appendChild(kmInp);
  var moInp=mkInp('number',T['rem-mohint'],tmpl&&tmpl.mo?tmpl.mo:'');
  var moRow=mk('div'); moRow.appendChild(moInp);
  iDiv.appendChild(kmRow); iDiv.appendChild(moRow); modal.appendChild(iDiv);
  var row=mk('div',{cls:'row2'});
  var ldate=mkInp('date','',new Date().toISOString().slice(0,10)); var df=mk('div',{cls:'field'}); df.appendChild(mk('label',{txt:T['rem-last']})); df.appendChild(ldate); row.appendChild(df);
  var lkm=mkInp('number','',car?car.mileage:''); var mf=mk('div',{cls:'field'}); mf.appendChild(mk('label',{txt:T['rem-lastkm']})); mf.appendChild(lkm); row.appendChild(mf);
  modal.appendChild(row);
  var ckm=mkInp('number','',car?car.mileage:''); addField(modal,T['rem-cur'],ckm);
  on(addField(modal,'',mk('button',{cls:'btnok',txt:T['rem-save']})),'click',function(){
    if (!title.value.trim()) { showToast(T['need-name']); return; }
    if (!D.reminders) D.reminders=[];
    D.reminders.push({id:uid(),carId:selCarId,title:title.value.trim(),icon:tmpl?tmpl.icon:'\ud83d\udd14',intervalType:selItype,intervalKm:kmInp.value,intervalMonths:moInp.value,lastDate:ldate.value,lastKm:lkm.value,currentKm:ckm.value,createdAt:new Date().toISOString()});
    save(D); closeModal(); showToast(T['added-rem']); render();
  });
}

function buildPlanForm(modal) {
  mHdr(modal,'\ud83d\udccb '+T['plan-modal'],false,null);
  modal.appendChild(mk('div',{css:'font-size:13px;color:var(--m);margin-bottom:16px;line-height:1.4',txt:T['plan-hint']}));
  var title=mkInp('text',''); addField(modal,T['plan-what']+' *',title);
  var part=mkInp('text',''); addField(modal,T['plan-part'],part);
  var priDiv=mk('div',{cls:'field'}); priDiv.appendChild(mk('label',{txt:T['plan-priority']}));
  var ps=mk('div',{cls:'prisel'}); var selPri='medium'; var pbtns=[];
  [['high',T['plan-urgent'],'prih'],['medium',T['plan-soon'],'prim'],['low',T['plan-low'],'pril']].forEach(function(p){
    var b=mk('button',{cls:'pribtn '+(p[0]==='medium'?p[2]:''),txt:p[1]});
    on(b,'click',function(){ pbtns.forEach(function(x){x.className='pribtn';}); b.className='pribtn '+p[2]; selPri=p[0]; });
    pbtns.push(b); ps.appendChild(b);
  });
  priDiv.appendChild(ps); modal.appendChild(priDiv);
  var row=mk('div',{cls:'row2'});
  var cost=mkInp('number',''); var cf=mk('div',{cls:'field'}); cf.appendChild(mk('label',{txt:T['plan-cost']})); cf.appendChild(cost); row.appendChild(cf);
  var dead=mkInp('date',''); var df=mk('div',{cls:'field'}); df.appendChild(mk('label',{txt:T['plan-deadline']})); df.appendChild(dead); row.appendChild(df);
  modal.appendChild(row);
  var notes=mkInp('textarea',''); addField(modal,T['plan-notes'],notes);
  on(addField(modal,'',mk('button',{cls:'btnok',txt:T['plan-add']})),'click',function(){
    if (!title.value.trim()) { showToast(T['need-name']); return; }
    if (!D.planned) D.planned=[];
    D.planned.push({id:uid(),carId:selCarId,title:title.value.trim(),part:part.value.trim(),priority:selPri,estimatedCost:cost.value,deadline:dead.value,notes:notes.value.trim(),category:'repair',createdAt:new Date().toISOString()});
    save(D); closeModal(); showToast(T['added-plan']); render();
  });
}

function fetchWeather() {
  if (!navigator.geolocation) { showToast(T['geo-unsupported']); return; }
  showToast(T['geo-detecting']);
  navigator.geolocation.getCurrentPosition(function(pos) {
    var K='bd5e378503939ddaee76f12ad7a97608';
    var lat=pos.coords.latitude, lon=pos.coords.longitude;
    Promise.all([
      fetch('https://api.openweathermap.org/data/2.5/weather?lat='+lat+'&lon='+lon+'&units=metric&lang=ru&appid='+K),
      fetch('https://api.openweathermap.org/data/2.5/forecast?lat='+lat+'&lon='+lon+'&units=metric&lang=ru&appid='+K)
    ]).then(function(rs){ return Promise.all(rs.map(function(r){return r.json();})); })
    .then(function(data){
      if (data[0].cod!==200) throw new Error('err');
      weatherData=data[0]; forecastData=data[1]; showToast(T['weather-loaded']); render();
    }).catch(function(){ showToast(T['weather-fail']); });
  }, function(){ showToast(T['weather-err']); });
}

// Auth state listener - entry point
auth.onAuthStateChanged(function(user) {
  if (user) {
    currentUser = user;
    loadFromCloud(function(cloudData) {
      D = cloudData;
      view = 'home';
      render();
    });
  } else {
    currentUser = null;
    D = load();
    renderAuth('login');
  }
});
