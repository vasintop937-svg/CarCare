<!DOCTYPE html>

<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
  <meta name="theme-color" content="#0D0F14"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>CarDiary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0D0F14;--surface:#161920;--surface2:#1E2230;--border:rgba(255,255,255,0.07);--accent:#C8FF00;--text:#F0F2F8;--muted:#7A8099;--radius:16px;--font-display:'Syne',sans-serif;--font-body:'DM Sans',sans-serif}
    body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh}
    #root{max-width:480px;margin:0 auto;min-height:100vh}
    .header{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 12px;position:sticky;top:0;z-index:50;background:linear-gradient(to bottom,var(--bg) 80%,transparent)}
    .header-logo{font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:-0.5px}
    .header-logo span{color:var(--accent)}
    .btn-icon{width:42px;height:42px;border-radius:12px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;color:var(--text)}
    .btn-icon:hover{background:var(--surface2)}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:all .2s}
    .card-hover:hover{border-color:rgba(200,255,0,.2);transform:translateY(-1px)}
    .cars-grid{display:flex;flex-direction:column;gap:12px;padding:0 16px 110px}
    .car-card{display:flex;gap:16px;align-items:center;cursor:pointer}
    .car-avatar{width:56px;height:56px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px}
    .car-info{flex:1;min-width:0}
    .car-name{font-family:var(--font-display);font-weight:700;font-size:17px}
    .car-meta{font-size:13px;color:var(--muted);margin-top:2px}
    .car-badge{background:var(--surface2);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap}
    .empty{text-align:center;padding:60px 32px}
    .empty-icon{width:80px;height:80px;border-radius:24px;background:var(--surface2);display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
    .empty h3{font-family:var(--font-display);font-size:20px;font-weight:700;margin-bottom:8px}
    .empty p{color:var(--muted);font-size:14px;line-height:1.5}
    .fab{position:fixed;bottom:28px;right:50%;transform:translateX(50%);background:var(--accent);color:#0D0F14;border:none;border-radius:14px;padding:14px 28px;font-family:var(--font-display);font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;cursor:pointer;box-shadow:0 8px 32px rgba(200,255,0,.25);transition:all .2s;z-index:40}
    .fab:hover{transform:translateX(50%) translateY(-2px)}
    .section-label{font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;padding:0 4px;margin-bottom:10px;margin-top:24px}
    .detail-wrap{padding:0 16px 130px}
    .detail-hero{background:linear-gradient(135deg,var(--surface) 0%,var(--surface2) 100%);border:1px solid var(--border);border-radius:20px;padding:24px;margin-bottom:20px}
    .detail-hero-top{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px}
    .detail-avatar{width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
    .detail-title{font-family:var(--font-display);font-size:22px;font-weight:800;line-height:1.2}
    .detail-sub{color:var(--muted);font-size:14px;margin-top:4px}
    .stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
    .stat-box{background:rgba(255,255,255,.04);border-radius:12px;padding:12px;border:1px solid var(--border)}
    .stat-val{font-family:var(--font-display);font-size:18px;font-weight:700}
    .stat-key{font-size:11px;color:var(--muted);margin-top:2px}
    .record-item{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:opacity .15s}
    .record-item:last-child{border-bottom:none}
    .record-item:hover{opacity:.8}
    .record-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:5px}
    .record-body{flex:1;min-width:0}
    .record-title{font-weight:500;font-size:15px}
    .record-meta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
    .record-cost{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--accent);flex-shrink:0}
    .cat-pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:500}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:flex-end;z-index:100;animation:fadeIn .2s ease}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .modal{width:100%;max-width:480px;margin:0 auto;background:var(--surface);border-radius:24px 24px 0 0;padding:24px 20px 40px;max-height:90vh;overflow-y:auto;animation:slideUp .25s ease}
    @keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
    .modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
    .modal-title{font-family:var(--font-display);font-size:20px;font-weight:700}
    .field{margin-bottom:16px}
    .field label{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
    .field input,.field select,.field textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;color:var(--text);font-family:var(--font-body);font-size:15px;transition:border-color .15s;outline:none}
    .field input:focus,.field select:focus,.field textarea:focus{border-color:rgba(200,255,0,.4)}
    .field textarea{resize:vertical;min-height:80px}
    .field select option{background:var(--surface2)}
    .fields-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .btn-primary{width:100%;padding:15px;border:none;border-radius:14px;background:var(--accent);color:#0D0F14;font-family:var(--font-display);font-size:16px;font-weight:700;cursor:pointer;transition:all .15s;margin-top:8px}
    .btn-primary:disabled{opacity:.4;cursor:default}
    .btn-danger{background:rgba(239,68,68,.1);color:#EF4444;border:1px solid rgba(239,68,68,.2);border-radius:12px;padding:12px;font-size:14px;font-weight:500;cursor:pointer;width:100%;font-family:var(--font-body);transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px}
    .query-box{background:var(--surface2);border:1px solid rgba(200,255,0,.2);border-radius:14px;padding:16px;margin-top:16px}
    .query-label{font-size:11px;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
    .query-text{font-family:var(--font-display);font-size:16px;font-weight:600;line-height:1.4;margin-bottom:14px}
    .query-links{display:flex;gap:8px;flex-wrap:wrap}
    .query-link{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:500;text-decoration:none;color:var(--text);transition:all .15s;display:inline-flex;align-items:center;gap:6px}
    .query-link:hover{border-color:rgba(200,255,0,.3);color:var(--accent)}
    .copy-btn{background:rgba(200,255,0,.1);border:1px solid rgba(200,255,0,.2);color:var(--accent);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
    .cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .cat-option{padding:12px;border-radius:12px;border:1px solid var(--border);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:10px;font-size:13px}
    .cat-option.active{border-color:var(--accent);background:rgba(200,255,0,.07)}
    .cat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
    .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px 18px;display:flex;align-items:center;gap:8px;font-size:14px;z-index:200;animation:toastIn .2s ease;box-shadow:0 8px 32px rgba(0,0,0,.4);white-space:nowrap}
    @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
    .emoji-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
    .emoji-btn{width:44px;height:44px;border-radius:12px;background:var(--surface2);border:1px solid var(--border);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
    .emoji-btn.active{border-color:var(--accent);background:rgba(200,255,0,.1)}
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
    .records-card{padding:4px 20px 20px}
    .total-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0 0;border-top:1px solid var(--border);margin-top:8px}
    .total-label{font-size:13px;color:var(--muted)}
    .total-val{font-family:var(--font-display);font-size:20px;font-weight:800;color:var(--accent)}
    .reminder-item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}
    .reminder-item:last-child{border-bottom:none}
    .rem-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
    .rem-body{flex:1;min-width:0}
    .rem-title{font-size:14px;font-weight:500}
    .rem-meta{font-size:12px;color:var(--muted);margin-top:2px}
    .progress-bar{height:4px;border-radius:2px;background:var(--surface2);margin-top:7px;overflow:hidden}
    .progress-fill{height:100%;border-radius:2px;transition:width .4s}
    .rem-badge{border-radius:8px;padding:4px 9px;font-size:11px;font-weight:600;white-space:nowrap;flex-shrink:0}
    .tmpl-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
    .tmpl-opt{padding:12px;border-radius:12px;border:1px solid var(--border);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:10px;font-size:13px}
    .tmpl-opt:hover{border-color:rgba(200,255,0,.3)}
    .pill-btn{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--muted);transition:all .15s}
    .pill-btn.active{border-color:var(--accent);background:rgba(200,255,0,.1);color:var(--accent)}
    .alert-banner{border-radius:14px;padding:13px 16px;display:flex;align-items:center;gap:12px;margin-bottom:8px;cursor:pointer;border:1px solid}
    .alert-banner.critical{background:rgba(239,68,68,.07);border-color:rgba(239,68,68,.2)}
    .alert-banner.warn{background:rgba(245,158,11,.07);border-color:rgba(245,158,11,.2)}
    .weather-card{border-radius:18px;padding:18px;border:1px solid var(--border);background:var(--surface);margin-bottom:4px}
    .w-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
    .w-temp{font-family:var(--font-display);font-size:38px;font-weight:800;line-height:1}
    .w-desc{font-size:13px;color:var(--muted);margin-top:3px}
    .w-city{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;margin-top:6px}
    .forecast-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px}
    .forecast-day{flex-shrink:0;background:rgba(255,255,255,.04);border-radius:10px;padding:8px 10px;text-align:center;min-width:52px}
    .fd-name{font-size:10px;color:var(--muted);margin-bottom:3px}
    .fd-max{font-family:var(--font-display);font-size:14px;font-weight:700}
    .fd-min{font-size:10px;color:var(--muted)}
    .tire-advice{border-radius:12px;padding:12px 14px;font-size:13px;font-weight:500;display:flex;align-items:flex-start;gap:10px;line-height:1.5}
    .tire-advice.ok{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.2);color:#10B981}
    .tire-advice.warn{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.25);color:#F59E0B}
    .tire-advice.critical{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:#EF4444}
    .tire-advice.danger{background:rgba(239,68,68,.15);border:2px solid rgba(239,68,68,.4);color:#EF4444}
    .tire-type-sel{display:flex;flex-direction:column;gap:5px}
    .plan-item{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--border)}
    .plan-item:last-child{border-bottom:none}
    .plan-priority{width:6px;border-radius:3px;flex-shrink:0;align-self:stretch;min-height:44px}
    .plan-body{flex:1;min-width:0}
    .plan-title{font-weight:500;font-size:15px;margin-bottom:3px;cursor:pointer}
    .plan-meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
    .plan-actions{display:flex;gap:8px;flex-wrap:wrap}
    .plan-done-btn{padding:6px 14px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:rgba(200,255,0,.12);color:var(--accent);transition:all .15s;display:flex;align-items:center;gap:5px}
    .plan-done-btn:hover{background:rgba(200,255,0,.22)}
    .plan-search-btn{padding:6px 12px;border-radius:10px;font-size:12px;cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--muted);transition:all .15s;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
    .plan-search-btn:hover{border-color:rgba(200,255,0,.3);color:var(--accent)}
    .priority-sel{display:flex;gap:8px;margin-bottom:4px}
    .priority-btn{flex:1;padding:10px 6px;border-radius:12px;border:1px solid var(--border);cursor:pointer;transition:all .15s;text-align:center;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted)}
    .priority-btn.active-high{border-color:#EF4444;background:rgba(239,68,68,.1);color:#EF4444}
    .priority-btn.active-medium{border-color:#F59E0B;background:rgba(245,158,11,.1);color:#F59E0B}
    .priority-btn.active-low{border-color:#10B981;background:rgba(16,185,129,.1);color:#10B981}
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── Storage ───────────────────────────────────────────────────────────────────
const SK = “cardiary_v4”;
function loadData() {
try { const r = localStorage.getItem(SK); return r ? JSON.parse(r) : { cars:[], records:[], reminders:[], planned:[] }; }
catch { return { cars:[], records:[], reminders:[], planned:[] }; }
}
function saveData(d) { try { localStorage.setItem(SK, JSON.stringify(d)); } catch {} }
const uid = () => Math.random().toString(36).slice(2,10);

// ── Icons ─────────────────────────────────────────────────────────────────────
function Icon({ name, size=20, color=“currentColor” }) {
const p = { width:size, height:size, viewBox:“0 0 24 24”, fill:“none”, stroke:color, strokeWidth:“2”, strokeLinecap:“round”, strokeLinejoin:“round” };
const icons = {
car:      <svg {…p}><path d="M5 17H3a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6"/><path d="M14 17H9"/><circle cx="5.5" cy="17.5" r="2.5"/><circle cx="18.5" cy="17.5" r="2.5"/><path d="M3 9h14l-2-5H5L3 9z"/></svg>,
plus:     <svg {…p} strokeWidth=“2.5”><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
wrench:   <svg {…p}><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>,
fuel:     <svg {…p}><line x1="3" y1="22" x2="15" y2="22"/><line x1="4" y1="9" x2="14" y2="9"/><path d="M14 22V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v18"/><path d="M14 13h2a2 2 0 0 1 2 2v2a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V9.83a2 2 0 0 0-.59-1.42L18 5"/></svg>,
trash:    <svg {…p}><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>,
back:     <svg {…p} strokeWidth=“2.5”><polyline points="15 18 9 12 15 6"/></svg>,
copy:     <svg {…p}><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>,
check:    <svg {…p} strokeWidth=“2.5”><polyline points="20 6 9 17 4 12"/></svg>,
bell:     <svg {…p}><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>,
spark:    <svg {…p}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>,
close:    <svg {…p} strokeWidth=“2.5”><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
list:     <svg {…p}><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>,
doc:      <svg {…p}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>,
tire:     <svg {…p}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="8"/><line x1="12" y1="16" x2="12" y2="22"/><line x1="2" y1="12" x2="8" y2="12"/><line x1="16" y1="12" x2="22" y2="12"/></svg>,
location: <svg {…p}><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>,
warning:  <svg {…p}><path d="M10.29 3.86L1.82 18h20.36L13.71 3.86z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>,
};
return icons[name] || null;
}

// ── Constants ─────────────────────────────────────────────────────────────────
const CATEGORIES = [
{ id:“maintenance”, label:“ТО / Обслуживание”, color:”#3B82F6”, icon:“wrench” },
{ id:“repair”,      label:“Ремонт”,            color:”#EF4444”, icon:“spark”  },
{ id:“tires”,       label:“Шины / Диски”,      color:”#10B981”, icon:“tire”   },
{ id:“fuel”,        label:“Топливо”,            color:”#F59E0B”, icon:“fuel”   },
{ id:“insurance”,   label:“Страховка / Доки”,  color:”#8B5CF6”, icon:“doc”    },
{ id:“other”,       label:“Прочее”,             color:”#6B7280”, icon:“list”   },
];
const catById = id => CATEGORIES.find(c=>c.id===id) || CATEGORIES[5];

const REM_TEMPLATES = [
{ id:“oil”,     label:“Замена масла”,      icon:“🛢️”, defaultKm:10000, defaultMonths:12   },
{ id:“brakes”,  label:“Тормозные колодки”, icon:“🛑”, defaultKm:30000, defaultMonths:null },
{ id:“filters”, label:“Воздушный фильтр”,  icon:“💨”, defaultKm:15000, defaultMonths:12   },
{ id:“anti”,    label:“Антифриз”,           icon:“🧊”, defaultKm:null,  defaultMonths:24   },
{ id:“battery”, label:“АКБ”,               icon:“🔋”, defaultKm:null,  defaultMonths:36   },
{ id:“timing”,  label:“Ремень ГРМ”,         icon:“⚙️”, defaultKm:60000, defaultMonths:null },

function genQuery(car, rec) {
return `${rec.part||rec.title} ${car.make} ${car.model} ${car.year}${car.engine?" "+car.engine:""}`.trim();
}

function remProgress(rem) {
const now = new Date(); let pct = 0;
if ((rem.intervalType===“date”||rem.intervalType===“both”) && rem.lastDate && rem.intervalMonths) {
const last=new Date(rem.lastDate), next=new Date(last);
next.setMonth(next.getMonth()+parseInt(rem.intervalMonths));
pct = Math.max(pct, Math.min(Math.round(((now-last)/(next-last))*100),110));
}
if ((rem.intervalType===“km”||rem.intervalType===“both”) && rem.lastKm && rem.intervalKm && rem.currentKm) {
pct = Math.max(pct, Math.min(Math.round(((rem.currentKm-rem.lastKm)/rem.intervalKm)*100),110));
}
return pct;
}
function pColor(pct) { return pct>=100?”#EF4444”:pct>=75?”#F59E0B”:”#10B981”; }
function daysLeft(rem) {
if (!rem.lastDate||!rem.intervalMonths) return null;
const next=new Date(rem.lastDate); next.setMonth(next.getMonth()+parseInt(rem.intervalMonths));
return Math.round((next-new Date())/86400000);
}

const inSpring = m===4||m===5||(m===6&&d<=5);

function TireWidget({ car, lastTire }) {

const fetch2 = async (lat,lon) => {
const K=“bd5e378503939ddaee76f12ad7a97608”;
try {
const [wr,fr] = await Promise.all([
fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=metric&lang=ru&appid=${K}`),
fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&units=metric&lang=ru&appid=${K}`),
]);
const w=await wr.json(), f=await fr.json();
if (w.cod!==200) throw new Error();
setWeather(w); setForecast(f);
} catch { setErr(“Не удалось загрузить погоду”); }
setLoading(false);
};

function RemItem({ rem, onDel }) {
const pct=remProgress(rem), color=pColor(pct), days=daysLeft(rem);
